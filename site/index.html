<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jake siddall</title>
  <meta name="description" content="jake siddall — a short letter from me to the internet.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #faf8f2; }
    body {
      color: #2b2a27;
      font-family: 'Lora', Georgia, serif;
      font-size: 17px;
      line-height: 1.8;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    main { max-width: 520px; width: 100%; }
    .greeting { font-size: 21px; font-weight: 700; }
    .blurb { margin-top: 1.25rem; }
    .placeholder {
      color: #a09b8e;
      font-style: italic;
    }
    figure {
      margin: 2.25rem auto 0;
      max-width: 260px;
      text-align: center;
      transform: rotate(-1.5deg);
      mix-blend-mode: multiply;
    }
    figure img {
      width: 100%;
      height: auto;
      filter: brightness(1.06) contrast(1.06);
    }
    figcaption {
      font-size: 13px;
      font-style: italic;
      color: #a09b8e;
      margin-top: 0.25rem;
    }
    .signature { margin-top: 2.25rem; font-size: 21px; }
    nav {
      margin-top: 2.5rem;
      font-size: 15px;
      color: #a09b8e;
    }
    nav a {
      color: #6b665b;
      text-decoration: underline;
      text-decoration-color: #cfc9bb;
      text-underline-offset: 3px;
    }
    nav a:hover { color: #2b2a27; text-decoration-color: #2b2a27; }
    .quiet { font-size: 13px; font-style: italic; }
    @media (max-width: 480px) {
      body { padding: 2rem 1.25rem; }
      figure { max-width: 240px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="greeting">hi, i'm jake.</p>

    <p class="blurb">
      I'm a dad and product manager (and aspiring mechanic) based in the
      East Bay. Someday, when I have time, perhaps I'll write down some of
      my thoughts here.
    </p>

    <figure>
      <img src="doodle.jpg" alt="a hand-drawn doodle of jake, his wife, and their daughter" width="900" height="887">
      <figcaption>the family, minus one on the way</figcaption>
    </figure>

    <p class="signature">— jake</p>

    <nav>
      <a href="mailto:jake.siddall@gmail.com?subject=hi%20jake%20—%20it%27s%20%5BYOUR%20NAME%5D%2C%20from%20the%20internet">say hi</a>
      <span> · </span>
      <a href="https://github.com/JakeSiddall">github</a>
      <span> · </span>
      <span>takes <span class="quiet">(nothing here yet)</span></span>
    </nav>
  </main>
</body>
</html>
